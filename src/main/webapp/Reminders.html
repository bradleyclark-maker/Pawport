<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PawPort Reminder System</title>
<style>
.site-header {
	background: white;
	border-bottom: 1px solid #dbe4f0;
	position: sticky;
	top: 0;
	z-index: 10;
}

.navbar {
	width: min(1200px, 94%);
	margin: 0 auto;
	padding: 14px 0;
	display: flex;
	justify-content: space-between;
	align-items: center;
	gap: 16px;
	flex-wrap: wrap;
}

.logo {
	font-size: 1.6rem;
	font-weight: 800;
	color: #2563eb;
}

.nav-links {
	display: flex;
	gap: 10px;
	flex-wrap: wrap;
}

.nav-links a {
	text-decoration: none;
	color: #1f2937;
	background: #f3f4f6;
	border: 1px solid #dbe4f0;
	padding: 10px 14px;
	border-radius: 12px;
	font-weight: 600;
}

.nav-links a:hover {
	background: #eff6ff;
	color: #2563eb;
}

.nav-links .login-btn {
	background: #2563eb;
	color: white;
	border-color: #2563eb;
}
</style>
</head>

<body>
	<header class="site-header">
		<nav class="navbar">
			<div class="logo">🐾 PawPort</div>

			<div class="nav-links">
				<a href="login" class="login-btn">Login</a> <a href="register.jsp">Register</a>
				<a href="search.html">Search</a> <a href="viewprofile.html">Profile</a>
				<a href="wishlist">Wishlist</a> <a href="Reminders.html">Reminders</a>
				<a href="documentVault.jsp">Vault</a>
			</div>
		</nav>
	</header>

	<h1>PawPort Reminder System</h1>

	<input id="name" placeholder="Name">
	<br>
	<input id="description" placeholder="Description">
	<br>
	<input type="date" id="date">
	<br>
	<input type="time" id="time">
	<br>
	<input id="email" placeholder="Email">
	<br>
	<br>

	<button onclick="addReminder()">Add Reminder</button>

	<p id="status"></p>

	<h2>Reminders:</h2>
	<ul id="list"></ul>

	<script>

function addReminder() {

    const name = document.getElementById("name").value;
    const description = document.getElementById("description").value;
    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value;
    const email = document.getElementById("email").value;

    fetch("ReminderServlet", { //check servlet
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body:
            "name=" + name +
            "&description=" + description +
            "&date=" + date +
            "&time=" + time +
            "&email=" + email
    })
    .then(res => res.text())
    .then(data => {
        document.getElementById("status").innerText = data;
        loadReminders();
    })
    .catch(err => console.error(err));
}

function loadReminders() {
    fetch("ReminderServlet") // check servlet
    .then(res => res.json())
    .then(data => {
        const list = document.getElementById("list");
        list.innerHTML = "";
        data.forEach(item => {
            const li = document.createElement("li");
            li.textContent = item;
            list.appendChild(li);
        });
    });
}

window.onload = loadReminders;

</script>

</body>
</html>
